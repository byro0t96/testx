name: Enhanced Repository Analysis

on:
  push:
    branches: [ "**" ]
  pull_request:
    types: [opened, closed, synchronize, reopened]
  workflow_dispatch:
    inputs:
      full_analysis:
        description: 'Perform full analysis (ignore cache)'
        required: false
        default: 'false'
        type: string
      max_files:
        description: 'Maximum files to analyze (0 = unlimited)'
        required: false
        default: '0'
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for deleting workflow file
      actions: read
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: ${{ github.event_name == 'push' && 50 || 0 }}

      - name: Verify installation status
        id: verify_install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if the app is still installed by attempting to get the installation
          # If it fails, the app was uninstalled and we should clean up
          INSTALLATION_URL="https://api.github.com/repos/${{ github.repository }}/installation"
          
          if curl -s -H "Authorization: token $GITHUB_TOKEN" "$INSTALLATION_URL" | grep -q '"id"'; then
            echo "✅ GitHub App is still installed"
            echo "INSTALLED=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ GitHub App is NOT installed or token is invalid"
            echo "INSTALLED=false" >> $GITHUB_OUTPUT
            echo "CLEANUP_NEEDED=true" >> $GITHUB_OUTPUT
          fi

      - name: Clean up workflow file (app uninstalled)
        if: steps.verify_install.outputs.INSTALLED == 'false'
        run: |
          echo "🧹 GitHub App is not installed. Removing workflow file..."
          
          WORKFLOW_PATH=".github/workflows/repo-analysis.yml"
          if [ -f "$WORKFLOW_PATH" ]; then
            # Get the current SHA of the workflow file
            SHA=$(git log -1 --format=%H -- "$WORKFLOW_PATH" 2>/dev/null || echo "")
            
            if [ -n "$SHA" ]; then
              # Delete the file locally
              rm -f "$WORKFLOW_PATH"
              
              # Commit and push the deletion
              git config user.name "GitHub Actions Cleanup"
              git config user.email "actions@github.com"
              git add "$WORKFLOW_PATH" 2>/dev/null || true
              git commit -m "chore: remove repo-analysis.yml (app uninstalled)" --allow-empty
              git push origin HEAD:${{ github.ref_name }}
              
              echo "✅ Workflow file removed from repository"
            else
              echo "⚠️ Could not find SHA for workflow file, skipping deletion"
            fi
          else
            echo "📝 Workflow file not found in repository"
          fi
          
          echo "⚠️ Workflow will not send data to the webhook"
          echo "CLEANUP_COMPLETE=true" >> $GITHUB_OUTPUT

      - name: Setup Python
        if: steps.verify_install.outputs.INSTALLED == 'true'
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Load webhook configuration
        if: steps.verify_install.outputs.INSTALLED == 'true'
        env:
          WEBHOOK_CONFIG: ${{ secrets.WEBHOOK_CONFIG }}
        run: |
          if [ -z "$WEBHOOK_CONFIG" ]; then
            echo "❌ WEBHOOK_CONFIG secret is not set!"
            exit 1
          fi

          mapfile -t PARTS <<< "$(printf '%s' "$WEBHOOK_CONFIG" | sed 's/::#?::/\\n/g')"

          WEBHOOK_ENDPOINT="${PARTS[0]}"
          WEBHOOK_API_TOKEN="${PARTS[1]}"
          BASE_URL="${PARTS[2]}"

          if [ -z "$WEBHOOK_ENDPOINT" ] || [ -z "$WEBHOOK_API_TOKEN" ] || [ -z "$BASE_URL" ]; then
            echo "❌ WEBHOOK_CONFIG is malformed"
            exit 1
          fi

          echo "::add-mask::$WEBHOOK_API_TOKEN"
          echo "::add-mask::$WEBHOOK_ENDPOINT"

          {
            echo "WEBHOOK_ENDPOINT=$WEBHOOK_ENDPOINT"
            echo "WEBHOOK_API_TOKEN=$WEBHOOK_API_TOKEN"
            echo "BASE_URL=$BASE_URL"
            echo "WEBSITE_BASE_URL=$BASE_URL"
          } >> "$GITHUB_ENV"

          echo "✅ Webhook configuration loaded"

      - name: Check repository size
        if: steps.verify_install.outputs.INSTALLED == 'true'
        id: check_size
        run: |
          TOTAL_SIZE=$(du -sb . 2>/dev/null | cut -f1 || echo "0")
          MAX_SIZE=$((100 * 1024 * 1024 * 1024))
          
          if [ -n "$TOTAL_SIZE" ] && [ "$TOTAL_SIZE" -gt "$MAX_SIZE" ]; then
            echo "⚠️ Repository size exceeds limit. Skipping full analysis."
            echo "LIMIT_EXCEEDED=true" >> $GITHUB_OUTPUT
          else
            echo "LIMIT_EXCEEDED=false" >> $GITHUB_OUTPUT
            echo "SIZE_MB=$(($TOTAL_SIZE/1024/1024))" >> $GITHUB_OUTPUT
          fi

      - name: Download analyzer script
        if: steps.verify_install.outputs.INSTALLED == 'true' && steps.check_size.outputs.LIMIT_EXCEEDED == 'false'
        run: |
          echo "📥 Downloading enhanced_analyzer.py from $BASE_URL/enhanced_analyzer.py"
          curl -L -o enhanced_analyzer.py "$BASE_URL/enhanced_analyzer.py?t=$WEBHOOK_API_TOKEN" \
            -H 'Accept: text/x-python' \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 2

          if [ ! -f enhanced_analyzer.py ]; then
            echo '❌ Failed to download enhanced_analyzer.py'
            exit 1
          fi

          LINE_COUNT=$(wc -l < enhanced_analyzer.py)
          echo "✅ Downloaded enhanced_analyzer.py ($LINE_COUNT lines)"

      - name: Run enhanced repository analysis
        if: steps.verify_install.outputs.INSTALLED == 'true' && steps.check_size.outputs.LIMIT_EXCEEDED == 'false'
        run: |
          echo "🚀 Starting analysis..."
          timeout 300 python3 enhanced_analyzer.py || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "⚠️ Analysis timed out after 300 seconds"
              echo "Creating partial results..."
            else
              echo "❌ Analysis failed with exit code: $EXIT_CODE"
              exit $EXIT_CODE
            fi
          }

          if [ -f "enhanced_analysis_result.json" ]; then
            echo "✅ Analysis completed successfully"
            FILE_SIZE=$(stat -c%s enhanced_analysis_result.json 2>/dev/null || stat -f%z enhanced_analysis_result.json 2>/dev/null || echo "0")
            echo "📊 Results file size: $(($FILE_SIZE/1024)) KB"
          else
            echo "❌ No analysis results generated"
            echo '{
              "error": "Analysis timed out or failed",
              "repository": "${{ github.repository }}",
              "summary": {
                "total_files": 0,
                "code_lines": 0
              }
            }' > enhanced_analysis_result.json
          fi

      - name: Send analysis to external service
        if: steps.verify_install.outputs.INSTALLED == 'true' && steps.check_size.outputs.LIMIT_EXCEEDED == 'false'
        run: |
          if [ -z "$WEBHOOK_ENDPOINT" ] || [ -z "$WEBHOOK_API_TOKEN" ]; then
            echo "❌ WEBHOOK_ENDPOINT / WEBHOOK_API_TOKEN not set!"
            exit 1
          fi

          if [ -f "enhanced_analysis_result.json" ]; then
            echo "📤 Sending analysis to $WEBHOOK_ENDPOINT"
            
            if curl -L -X POST "$WEBHOOK_ENDPOINT" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "X-API-Token: $WEBHOOK_API_TOKEN" \
              -H "X-GitHub-Event: ${{ github.event_name }}" \
              -H "X-Repository: ${{ github.repository }}" \
              -H "X-Run-ID: ${{ github.run_id }}" \
              -d @enhanced_analysis_result.json \
              --max-time 60 \
              --connect-timeout 15 \
              --retry 2 \
              --retry-delay 5 \
              -f \
              -s \
              -o /dev/null; then
              echo "✅ Analysis sent successfully"
            else
              echo "❌ Failed to send analysis"
              
              # Try alternative endpoint
              if [[ "$WEBHOOK_ENDPOINT" == */ ]]; then
                ALT_ENDPOINT="${WEBHOOK_ENDPOINT}"
              else
                ALT_ENDPOINT="${WEBHOOK_ENDPOINT}/"
              fi
              echo "🔄 Retrying with alternative endpoint: $ALT_ENDPOINT"
              
              if curl -L -X POST "$ALT_ENDPOINT" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -H "X-API-Token: $WEBHOOK_API_TOKEN" \
                -d @enhanced_analysis_result.json \
                --max-time 60 \
                --connect-timeout 15 \
                --retry 2 \
                -f \
                -s \
                -o /dev/null; then
                echo "✅ Analysis sent successfully on retry"
              else
                echo "❌ Failed to send analysis on retry"
                exit 1
              fi
            fi
          else
            echo "❌ Analysis file not found"
            exit 1
          fi

      - name: Upload analysis artifact
        if: steps.verify_install.outputs.INSTALLED == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: enhanced-analysis-${{ github.run_id }}
          path: enhanced_analysis_result.json
          retention-days: 7
